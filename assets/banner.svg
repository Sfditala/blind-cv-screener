<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Scored on what they did, not who they are. CVs are anonymized before scoring, and every score needs a quote from the CV."><style>.pulse{animation:p 5.4s infinite both}.dot{offset-path:path('M110 244 H1090');animation:m 5.4s infinite linear}@keyframes m{0%{offset-distance:0%;opacity:0}4%{opacity:1}72%{offset-distance:100%;opacity:1}78%,100%{offset-distance:100%;opacity:0}}@keyframes p{0%,100%{stroke:#3a3a3a}6%,16%{stroke:#34d399}26%{stroke:#3a3a3a}}@media (prefers-reduced-motion:reduce){.pulse,.dot{animation:none}.dot{opacity:0}}</style><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".07"/></pattern></defs><rect width="1200" height="340" rx="18" fill="#0a0a0a"/><rect width="1200" height="340" rx="18" fill="url(#g)"/><text x="60" y="100" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="52" font-weight="650" letter-spacing="-2" fill="#f5f5f5">Scored on what they did, <tspan fill="#34d399">not who they are.</tspan></text><text x="62" y="146" font-family="Consolas, Menlo, monospace" font-size="19" fill="#a1a1a1">Name, gender, age and nationality are removed first. Every score needs a quote from the CV.</text><path d="M110 244 H1090" stroke="#fff" stroke-opacity=".22" stroke-width="2"/><rect class="pulse" style="animation-delay:0.0s" x="80" y="214" width="60" height="60" rx="14" fill="#161616" stroke="#3a3a3a" stroke-width="2"/><circle cx="110" cy="244" r="8" fill="#6b7280"/><text x="110" y="302" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#d0d0d0">CV (PDF)</text><rect class="pulse" style="animation-delay:0.9s" x="276" y="214" width="60" height="60" rx="14" fill="#161616" stroke="#3a3a3a" stroke-width="2"/><circle cx="306" cy="244" r="8" fill="#34d399"/><text x="306" y="302" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#d0d0d0">Remove identity</text><rect class="pulse" style="animation-delay:1.8s" x="472" y="214" width="60" height="60" rx="14" fill="#161616" stroke="#3a3a3a" stroke-width="2"/><circle cx="502" cy="244" r="8" fill="#6b7280"/><text x="502" y="302" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#d0d0d0">Check in code</text><rect class="pulse" style="animation-delay:2.7s" x="668" y="214" width="60" height="60" rx="14" fill="#161616" stroke="#3a3a3a" stroke-width="2"/><circle cx="698" cy="244" r="8" fill="#6b7280"/><text x="698" y="302" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#d0d0d0">Score + quote</text><rect class="pulse" style="animation-delay:3.6s" x="864" y="214" width="60" height="60" rx="14" fill="#161616" stroke="#3a3a3a" stroke-width="2"/><circle cx="894" cy="244" r="8" fill="#34d399"/><text x="894" y="302" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#d0d0d0">Verify quote</text><rect class="pulse" style="animation-delay:4.5s" x="1060" y="214" width="60" height="60" rx="14" fill="#161616" stroke="#3a3a3a" stroke-width="2"/><circle cx="1090" cy="244" r="8" fill="#6b7280"/><text x="1090" y="302" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#d0d0d0">Sheet + draft</text><circle class="dot" r="6" fill="#34d399"/></svg>